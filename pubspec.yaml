name: vaultify
description: "Offline password generator and keeper."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4
  path_provider: ^2.1.6
  flutter_riverpod: ^3.4.3
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  window_manager: ^0.5.2
  # Window size memory: reads display sizes so a window saved on a monitor
  # that is now unplugged is pulled back on screen. Already used inside
  # window_manager; named here because Vaultify calls it directly.
  screen_retriever: ^0.2.2
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  # Fonts are bundled so the app never fetches anything over the network.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400

# App icons: generated from assets/icon/ by `dart run flutter_launcher_icons`.
# Redraw the sources first with `flutter test tool/make_icon.dart`.
flutter_launcher_icons:
  image_path: assets/icon/vaultify.png
  android: true
  adaptive_icon_background: "#1A9E5B"
  adaptive_icon_foreground: assets/icon/vaultify_foreground.png
  ios: true
  image_path_ios: assets/icon/vaultify_ios.png
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: assets/icon/vaultify.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/vaultify.png
