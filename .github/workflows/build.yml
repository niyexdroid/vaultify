# Release builds: a version tag (v1.0.0) builds Vaultify for all four
# platforms and attaches the files to a GitHub Release. Running it by hand from
# the Actions tab builds the same files without making a release.
name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Keeps every job on the same Flutter as the development machine, so CI and
# local builds behave the same. Bump this and the local Flutter together.
env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  # Gate: the same two commands the project rules ask for before a milestone
  # counts as done. Nothing is packaged if either fails.
  checks:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Version number: taken from the tag (v1.0.0 -> 1.0.0) so the installer, the
  # app and the release name all agree. A manual run keeps pubspec's version.
  # The build number is the run number, which only ever grows.
  version:
    name: Work out the version
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.pick.outputs.name }}
      args: ${{ steps.pick.outputs.args }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            name="${GITHUB_REF_NAME#v}"
            echo "name=$name" >> "$GITHUB_OUTPUT"
            echo "args=--build-name=$name --build-number=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          else
            name=$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)
            echo "name=$name" >> "$GITHUB_OUTPUT"
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

  # Windows installer: Vaultify-<version>-Setup.exe, packed by the Inno Setup
  # script in windows/packaging/vaultify.iss.
  windows:
    name: Windows installer
    needs: [checks, version]
    # Pinned to the 2022 image on purpose: windows-latest now ships MSVC 14.51,
    # whose toolchain rejects <experimental/coroutine> (STL1011 / C2338), and the
    # local_auth_windows plugin still includes that header. Vaultify's own code
    # builds on either image. Drop the pin once local_auth_windows is updated.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the app
        run: flutter build windows --release ${{ needs.version.outputs.args }}
      - name: Pack the installer
        shell: bash
        # Git Bash rewrites arguments that look like Unix paths, which turned
        # /DAppVersion=1.0.0 into C:/Program Files/Git/DAppVersion=1.0.0 and made
        # ISCC see a second script name. These two switch that rewriting off.
        env:
          MSYS_NO_PATHCONV: "1"
          MSYS2_ARG_CONV_EXCL: "*"
        run: |
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$iscc" ]; then
            choco install innosetup -y --no-progress
          fi
          "$iscc" windows/packaging/vaultify.iss "/DAppVersion=${{ needs.version.outputs.name }}"

      # Signing input: SignPath reads the installer from a GitHub artifact, so the
      # unsigned file is uploaded first. This artifact is a build-time stepping
      # stone; the release job only collects the dist-* artifacts.
      - name: Upload the unsigned installer
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installer
          path: build/installer/Vaultify-${{ needs.version.outputs.name }}-Setup.exe
          if-no-files-found: error

      # Secrets cannot be read in a step-level "if", so the check becomes an output.
      - name: Is there a signing certificate?
        id: signing
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -n "$SIGNPATH_API_TOKEN" ]; then
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "No SIGNPATH_API_TOKEN secret set: shipping the installer unsigned."
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      # Windows code signing: free open-source signing by SignPath Foundation.
      # Dormant until the certificate is granted and the two secrets are added;
      # see PUBLISHING.md and docs/signing.html.
      - name: Sign the installer
        if: steps.signing.outputs.have == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: vaultify
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/signed

      # Whichever installer exists wins: the signed one if signing ran, the
      # unsigned one otherwise. The published filename is the same either way.
      - name: Collect the installer to publish
        shell: bash
        run: |
          mkdir -p build/dist
          exe="Vaultify-${{ needs.version.outputs.name }}-Setup.exe"
          if [ -f "build/signed/$exe" ]; then
            echo "Publishing the signed installer."
            cp "build/signed/$exe" "build/dist/$exe"
          else
            cp "build/installer/$exe" "build/dist/$exe"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: build/dist/Vaultify-${{ needs.version.outputs.name }}-Setup.exe
          if-no-files-found: error

  # macOS disk image: Vaultify-<version>.dmg, a drag-to-Applications image. It is
  # unsigned until there is an Apple Developer account, so the first open needs
  # right-click > Open; see README.
  macos:
    name: macOS DMG
    needs: [checks, version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build the app
        run: flutter build macos --release ${{ needs.version.outputs.args }}
      - name: Make the disk image
        run: |
          staging=build/dmg
          rm -rf "$staging"
          mkdir -p "$staging"
          cp -R build/macos/Build/Products/Release/Vaultify.app "$staging/"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname Vaultify -srcfolder "$staging" -ov -format UDZO "build/Vaultify-${{ needs.version.outputs.name }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: build/Vaultify-${{ needs.version.outputs.name }}.dmg
          if-no-files-found: error

  # Android packages: .aab for the Play Store and .apk for direct sharing.
  # Signed with the upload key when the repository secrets are set; otherwise
  # debug-signed, which installs for testing but cannot go on the Play Store.
  android:
    name: Android AAB and APK
    needs: [checks, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Write the upload key, if there is one
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret set: building with debug keys."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
      - name: Build the bundle and the APK
        run: |
          flutter build appbundle --release ${{ needs.version.outputs.args }}
          flutter build apk --release ${{ needs.version.outputs.args }}
      - name: Name the files after the version
        run: |
          mkdir -p build/release
          v="${{ needs.version.outputs.name }}"
          cp build/app/outputs/bundle/release/app-release.aab "build/release/Vaultify-$v.aab"
          cp build/app/outputs/flutter-apk/app-release.apk "build/release/Vaultify-$v.apk"
      - name: Delete the upload key from the runner
        if: always()
        run: rm -f android/key.properties android/upload-keystore.jks
      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: build/release/*
          if-no-files-found: error

  # iOS build: unsigned, which is as far as CI goes without an Apple Developer
  # account. It proves the iOS build compiles; turning it into an .ipa for
  # TestFlight needs signing credentials added here later.
  ios:
    name: iOS build
    needs: [checks, version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build without signing
        run: flutter build ios --release --no-codesign ${{ needs.version.outputs.args }}
      - name: Zip the app
        run: |
          mkdir -p build/release
          cd build/ios/iphoneos
          zip -r -q "$GITHUB_WORKSPACE/build/release/Vaultify-${{ needs.version.outputs.name }}-ios-unsigned.zip" Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: dist-ios
          path: build/release/Vaultify-${{ needs.version.outputs.name }}-ios-unsigned.zip
          if-no-files-found: error

  # Release page: collects the four platforms' files and attaches them to a
  # draft GitHub Release for the tag. Draft, so the download page can be
  # checked and the notes written before anyone sees it.
  release:
    name: Draft the release
    needs: [version, windows, macos, android, ios]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Only the dist-* artifacts are the files people download. The unsigned
      # installer uploaded for SignPath is deliberately left behind.
      - uses: actions/download-artifact@v4
        with:
          path: files
          pattern: dist-*
          merge-multiple: true
      - name: Attach the files to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -R files
          # Release notes live in .github/release-notes.md so they can be reviewed
          # in a pull request and stay the same for every release. The SHA-256 of
          # each file is appended per release: while the installer is unsigned,
          # comparing hashes is the only way a downloader can check what they got.
          notes="$RUNNER_TEMP/release-notes.md"
          cp .github/release-notes.md "$notes"
          {
            echo
            echo "## Verifying your download"
            echo
            echo 'SHA-256 of each file in this release:'
            echo
            echo '```'
            ( cd files && sha256sum * )
            echo '```'
            echo
            echo 'Windows: `Get-FileHash .\<file> -Algorithm SHA256`.'
            echo 'macOS or Linux: `shasum -a 256 <file>`.'
            echo
            echo 'How these files are built and who may sign them:'
            echo '<https://niyexdroid.github.io/vaultify/signing.html>'
          } >> "$notes"
          gh release create "$GITHUB_REF_NAME" --draft \
            --title "Vaultify ${{ needs.version.outputs.name }}" \
            --notes-file "$notes" \
            files/*
